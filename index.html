<!doctype html>
<!-- lang is kept in sync with the active locale by src/i18n.js; "en" here
     matches i18next's default so the initial paint is honest. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Accessibilité & zoom utilisateur -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre SEO clair -->
    <title>Sidick Abdoulaye Hissein - Portfolio Officiel</title>
    <!-- Description SEO -->
    <meta
      name="description"
      content="Portfolio officiel de Sidick Abdoulaye Hissein (Sidick Sino), développeur web et mobile basé à Kigali. Découvrez mes projets en React, Node.js, et UI/UX design."
    />
    <!-- Mots-clés -->
    <meta
      name="keywords"
      content="Sidick, Sidick Abdoulaye, Sidick Sino, développeur, portfolio, web developer, React, Node.js, Kigali"
    />
    <!-- Auteur -->
    <meta name="author" content="Sidick Abdoulaye Hissein" />
    <!-- Canonical URL -->
    <link rel="canonical" href="https://sidick.vercel.app" />
    <!-- Open Graph (réseaux sociaux) -->
    <meta property="og:title" content="Sidick Abdoulaye Hissein | Portfolio" />
    <meta
      property="og:description"
      content="Découvrez mes projets et compétences en développement web et mobile."
    />
    <meta property="og:url" content="https://sidick.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://sidick.vercel.app/preview.jpg" />

    <!-- Twitter Card (facultatif mais utile) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sidick Abdoulaye Hissein | Portfolio" />
    <meta
      name="twitter:description"
      content="Découvrez mes projets web et mobiles réalisés avec React et Node.js."
    />
    <meta name="twitter:image" content="https://sidick.vercel.app/preview.jpg" />
    <meta name="google-site-verification" content="-MDj_7J5aMW8x4XK-D202rj7wAS8awtx2z7JY_QARgQ" />

    <!-- Fonts, loaded once.
         Previously each of 10 component stylesheets carried its own
         @import url(...) for the same families. @import inside CSS is
         render-blocking and serialised — the browser must fetch the CSS,
         parse it, then start the font request — so it was both duplicated and
         on the slow path. A <link> here starts the fetch immediately.

         Weights are only the ones actually used: 400/500/600/700/800/900,
         no italics (none are used anywhere in src/). Abril Fatface was
         dropped — --font-fire aliases to --font-display, so it was being
         downloaded and never rendered. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&family=Epilogue:wght@400;500;600;700;800;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
