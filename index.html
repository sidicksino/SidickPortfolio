<!doctype html>
<!-- lang is kept in sync with the active locale by src/i18n.js; "en" here
     matches i18next's default so the initial paint is honest. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Accessibilité & zoom utilisateur -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre SEO clair -->
    <title>Sidick Abdoulaye Hissein | Data Scientist &amp; Full-Stack Developer</title>
    <!-- Mots-clés -->
    <meta
      name="keywords"
      content="Sidick, Sidick Abdoulaye, Sidick Sino, développeur, portfolio, web developer, React, Node.js, Kigali"
    />
    <!-- Auteur -->
    <meta name="author" content="Sidick Abdoulaye Hissein" />
    <!-- Canonical URL -->

    <!-- <title>, description, canonical and hreflang are set per language by
         src/components/Seo.jsx — Google renders JS and picks them up.
         The og:*/twitter:* tags below stay static and English: social scrapers
         do not run JS, so the share card cannot vary by language without
         prerendering. Nothing is declared in both places, or the <head> ends
         up with two of each. -->
    <!-- Open Graph (réseaux sociaux) -->
    <meta property="og:title" content="Sidick Abdoulaye Hissein | Portfolio" />
    <meta
      property="og:description"
      content="Data Scientist and Full-Stack Developer. Web platforms, mobile apps and machine-learning products."
    />
    <meta property="og:url" content="https://www.sidickabdoulaye.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.sidickabdoulaye.com/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sidick Abdoulaye Hissein — Data Scientist and Full-Stack Developer"
    />
    <meta property="og:site_name" content="Sidick Sino" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Twitter Card (facultatif mais utile) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sidick Abdoulaye Hissein | Portfolio" />
    <meta
      name="twitter:description"
      content="Data Scientist and Full-Stack Developer. Web platforms, mobile apps and machine-learning products."
    />
    <meta name="twitter:image" content="https://www.sidickabdoulaye.com/preview.jpg" />
    <meta
      name="twitter:image:alt"
      content="Sidick Abdoulaye Hissein — Data Scientist and Full-Stack Developer"
    />
    <meta name="google-site-verification" content="-MDj_7J5aMW8x4XK-D202rj7wAS8awtx2z7JY_QARgQ" />

    <!-- Fonts, loaded once.
         Previously each of 10 component stylesheets carried its own
         @import url(...) for the same families. @import inside CSS is
         render-blocking and serialised — the browser must fetch the CSS,
         parse it, then start the font request — so it was both duplicated and
         on the slow path. A <link> here starts the fetch immediately.

         2026-11 redesign: Space Grotesk (display), Inter (body) and
         JetBrains Mono (labels). Only the weights actually used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- Apply a visitor's saved colour and light/dark choice before anything
         paints, so the page never flashes the defaults first. Keep this list in sync
         with src/components/theme/accents.js. -->
    <script>
      try {
        var accents = { magenta: "#e748c8", aqua: "#2dd4bf", violet: "#8b7cff", lime: "#a3e635" };
        var saved = accents[localStorage.getItem("accent")];
        if (saved) document.documentElement.style.setProperty("--accent", saved);
        // Same for light mode: without this the page paints dark, then flips
        // once React's ThemeProvider runs.
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.add("light-theme");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
